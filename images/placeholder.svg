<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c140e"/>
      <stop offset="50%" stop-color="#2a1b12"/>
      <stop offset="100%" stop-color="#120c08"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4882e"/>
      <stop offset="50%" stop-color="#e6a84c"/>
      <stop offset="100%" stop-color="#9a5b18"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6a84c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1c140e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="300" cy="180" r="140" fill="url(#glow)"/>
  
  <!-- Subtle border pattern -->
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="#d4882e" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 4"/>
  
  <!-- Stylized Glencairn Tasting Glass -->
  <g transform="translate(300, 160)" stroke="url(#amber)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bowl / Rim -->
    <path d="M-22,-60 C-22,-60 22,-60 22,-60 C26,-40 38,-15 36,15 C34,40 18,55 0,55 C-18,55 -34,40 -36,15 C-38,-15 -26,-40 -22,-60 Z" />
    <!-- Whiskey liquid inside -->
    <path d="M-30,10 C-15,6 15,6 30,10 C32,28 18,48 0,48 C-18,48 -32,28 -30,10 Z" fill="url(#amber)" fill-opacity="0.35"/>
    <path d="M-30,10 C-15,6 15,6 30,10" stroke="#f3c87a" stroke-width="2"/>
    <!-- Stem & Base -->
    <path d="M-6,55 L-8,68 C-18,72 -22,76 -20,80 L20,80 C22,76 18,72 8,68 L6,55" fill="#2a1b12" fill-opacity="0.8"/>
  </g>
  
  <text x="300" y="275" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="18" fill="#e6a84c" text-anchor="middle" letter-spacing="3" font-weight="600">WHISKEY ARCHIVE</text>
  <text x="300" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#bfa588" text-anchor="middle" letter-spacing="1">TASTING ROOM COLLECTION</text>
</svg>
